name: Verify
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: bash mvnw -B -ntp verify
        env:
          INITIAL_ADMIN_ENABLED: 'false'
          SPRING_FLYWAY_ENABLED: 'false'
          SPRING_DATASOURCE_URL: jdbc:h2:mem:ci;MODE=MySQL;NON_KEYWORDS=YEAR;DB_CLOSE_DELAY=-1
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD: ''
      - name: Verify packaged migrations
        run: python3 deploy/aws/verify_migrations.py target/erp-0.0.1-SNAPSHOT.jar
      - uses: actions/upload-artifact@v4
        with:
          name: backend-${{ github.sha }}
          path: target/erp-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test --test-concurrency=2 --test-timeout=120000 --test-force-exit tests/*.test.js
      - run: node tests/csp-browser.mjs
        env:
          CHROME_BIN: google-chrome
      - run: npm run build
        env:
          VITE_API_URL: ''
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7
