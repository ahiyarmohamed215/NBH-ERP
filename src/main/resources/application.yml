server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: erp
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nbhdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

# Application-specific configuration
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://*.vercel.app}
  jwt:
    # 256-bit secure secret key
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:86400000} # 24 hours
    refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000} # 7 days
  security:
    initial-admin:
      enabled: ${INITIAL_ADMIN_ENABLED:true}
      username: ${INITIAL_ADMIN_USERNAME:admin}
      password: ${INITIAL_ADMIN_PASSWORD:admin123}
      email: ${INITIAL_ADMIN_EMAIL:admin@nbh.com}
  company:
    name: NBH Warehouse & Distribution
    address: 123 Commercial Avenue, Colombo, Sri Lanka
    phone: "+94 11 234 5678"
    currency: LKR
    currency-symbol: "Rs."
    default-tax-rate: 0.00

# SpringDoc OpenAPI configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
