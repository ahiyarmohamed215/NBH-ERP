server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}
  servlet:
    context-path: /

spring:
  application:
    name: erp
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nbhdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:10}
      idle-timeout: 300000
      connection-timeout: 5000
      max-lifetime: 1200000
      leak-detection-threshold: 5000
  flyway:
    enabled: true
    baseline-on-migrate: ${DB_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:validate}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

# Application-specific configuration
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://nbh-erp.vercel.app}
  jwt:
    # 256-bit secure secret key. Must be set via the JWT_SECRET environment variable.
    secret: ${JWT_SECRET:}
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000} # 15 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:1800000} # 30 minutes
  security:
    cookie:
      secure: ${COOKIE_SECURE:false}
      same-site: ${COOKIE_SAME_SITE:Lax}
    refresh-session:
      retention-days: ${REFRESH_SESSION_RETENTION_DAYS:1}
      cleanup-cron: ${REFRESH_SESSION_CLEANUP_CRON:0 0 3 * * ?}
    initial-admin:
      enabled: ${INITIAL_ADMIN_ENABLED:false}
      username: ${INITIAL_ADMIN_USERNAME:admin}
      password: ${INITIAL_ADMIN_PASSWORD:}
      email: ${INITIAL_ADMIN_EMAIL:admin@nbh.com}
  company:
    name: ${APP_COMPANY_NAME:${COMPANY_NAME:NBH Warehouse & Distribution}}
    address: ${APP_COMPANY_ADDRESS:${COMPANY_ADDRESS:123 Commercial Avenue, Colombo, Sri Lanka}}
    phone: ${APP_COMPANY_PHONE:${COMPANY_PHONE:+94 11 234 5678}}
    currency: ${APP_COMPANY_CURRENCY:LKR}
    currency-symbol: ${APP_COMPANY_CURRENCY_SYMBOL:${COMPANY_CURRENCY_SYMBOL:Rs.}}
    default-tax-rate: ${APP_COMPANY_DEFAULT_TAX_RATE:0.00}
  business-timezone: ${APP_BUSINESS_TIMEZONE:Asia/Colombo}
  warehouse-print:
    poll-ms: ${APP_WAREHOUSE_PRINT_POLL_MS:5000}

# SpringDoc OpenAPI configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
