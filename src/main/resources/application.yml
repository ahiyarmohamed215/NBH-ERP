server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: erp
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nbhdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:10}
      idle-timeout: 300000
      connection-timeout: 5000
      max-lifetime: 1200000
      leak-detection-threshold: 5000
  flyway:
    enabled: true
    baseline-on-migrate: ${DB_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:validate}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

# Application-specific configuration
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://nbh-erp.vercel.app,https://*.vercel.app}
  jwt:
    # 256-bit secure secret key
    secret: ${JWT_SECRET:dGVzdC1vbmx5LXNlY3JldC1rZXktMzItYnl0ZXMtbG9uZy0xMjM0NTY=}
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000} # 15 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000} # 7 days
  security:
    initial-admin:
      enabled: ${INITIAL_ADMIN_ENABLED:false}
      username: ${INITIAL_ADMIN_USERNAME:admin}
      password: ${INITIAL_ADMIN_PASSWORD:}
      email: ${INITIAL_ADMIN_EMAIL:admin@nbh.com}
  company:
    name: NBH Warehouse & Distribution
    address: 123 Commercial Avenue, Colombo, Sri Lanka
    phone: "+94 11 234 5678"
    currency: LKR
    currency-symbol: "Rs."
    default-tax-rate: 0.00

# SpringDoc OpenAPI configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
