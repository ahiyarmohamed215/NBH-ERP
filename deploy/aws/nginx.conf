# ==============================================================================
# NBH ERP - NGINX Production Configuration
# Target: AWS EC2 Ubuntu 24.04, with Spring Boot on loopback and MySQL on RDS
# Set the domain, TLS certificate paths and frontend release paths before use.
# Deployment Path: /etc/nginx/sites-available/nbh-erp.conf
# Enabled Symlink: /etc/nginx/sites-enabled/nbh-erp.conf
#
# Instructions:
# 1. Replace 'erp.example.com' with your actual public HTTPS domain.
# 2. Issue SSL certificate via certbot:
#    sudo certbot certonly --nginx -d erp.example.com
# 3. Test configuration: sudo nginx -t
# 4. Reload service: sudo systemctl reload nginx
# ==============================================================================

# Backend upstream targeting loopback Spring Boot service
upstream springboot_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server - Port 80
# Redirects all plain HTTP traffic to HTTPS (Port 443)
# Allows ACME challenge validation for Let's Encrypt SSL certificates
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name erp.example.com;

    # Let's Encrypt ACME HTTP-01 challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Health check for Load Balancers (Port 80)
    location /health/ {
        proxy_pass http://springboot_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        access_log off;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server - Port 443 (HTTP/2 + TLS)
# Serves static React build, handles reverse proxy to Spring Boot, and handles SSE
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.example.com;

    # Document root for the React production build (atomic symlink to active release)
    root /var/www/erp/current;
    index index.html;

    # Hide NGINX server version tokens for security
    server_tokens off;

    # Client upload size limit (e.g. invoice attachments, Excel templates)
    client_max_body_size 16M;

    # SSL Certificate & Private Key (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/erp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.example.com/privkey.pem;

    # Modern TLS Security Parameters (Mozilla Intermediate Standard)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # SSL Session Optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling (Validates certificate revocation status securely)
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/erp.example.com/chain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # --------------------------------------------------------------------------
    # Production Security Headers (Server Level)
    # Note: In NGINX, if a child location defines ANY add_header directive, it
    # does NOT inherit add_header directives from the parent block.
    # Therefore, /assets/, static media, and /index.html explicitly redeclare these
    # headers so all responses maintain full security protections.
    # --------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

    # --------------------------------------------------------------------------
    # GZIP Compression (Reduces network transfer for text, scripts, and styles)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # --------------------------------------------------------------------------
    # 3. Static Assets Caching & SPA Routing
    # --------------------------------------------------------------------------

    # Vite hashed bundle assets: served from cumulative pool
    # Guarantees old tabs in existing sessions can load previous chunks without 404 ChunkLoadErrors
    # Uses single Cache-Control header (no duplicate expires) and explicitly redeclares security headers
    location /assets/ {
        alias /var/www/erp/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
        access_log off;
    }

    # Public static media and root assets (30-day cache, no duplicate expires)
    location ~* \.(ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
        access_log off;
    }

    # SPA Entry Point: Never cache index.html to guarantee instant updates on new deploys
    # Redeclares all security headers to guarantee they are sent with index.html
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
    }

    # Standard React Client Routing (fallback to index.html for React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # 4. Real-Time Server-Sent Events (SSE) Proxy: /api/v1/events
    # CRITICAL: Buffering and caching MUST be disabled for real-time delivery
    # --------------------------------------------------------------------------
    location /api/v1/events {
        proxy_pass http://springboot_backend;
        proxy_http_version 1.1;

        # Disable buffering, caching, and connection reuse for SSE stream
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;

        # Long read/send timeouts to keep persistent HTTP event stream open
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Identity headers for accurate origin and client tracking
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # --------------------------------------------------------------------------
    # 5. REST API Reverse Proxy: /api/
    # Proxies JSON endpoints, authentication, and reporting to Spring Boot
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://springboot_backend;
        proxy_http_version 1.1;

        # Keepalive upstream connection
        proxy_set_header Connection "";

        # Standard forward headers for Spring Boot HttpServletRequest
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # Proxy buffer tuning for JSON payloads
        proxy_buffer_size 16k;
        proxy_buffers 4 64k;
        proxy_busy_buffers_size 128k;

        # REST request timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 5b. Health Checks Reverse Proxy: /health/
    # Proxies ALB / AWS Route 53 health check probes directly to Spring Boot backend
    # Guarantees health checks verify backend health, not React's fallback HTML
    # --------------------------------------------------------------------------
    location /health/ {
        proxy_pass http://springboot_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 6. Error Pages for Backend Interruptions (Graceful Restart Handling)
    # --------------------------------------------------------------------------
    error_page 502 503 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
    }

    # --------------------------------------------------------------------------
    # 8. Security Hygiene: Block Hidden Files and Sensitive Paths
    # --------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # NGINX error logging
    error_log /var/log/nginx/nbh-erp-error.log warn;
    access_log /var/log/nginx/nbh-erp-access.log;
}
